name: Release
# Cut the GitHub release for a version tag. `cargo xtask release <spec> --push`
# is what creates and pushes that tag; this is what happens afterwards.
#
# As in ci.yml, this file holds no knowledge of the repository. The release body
# is `cargo xtask release-notes "$TAG"`, which slices the section that tag's own
# tree already carries in `docs/CHANGELOG.md` — so the notes on the release page
# are byte-identical to the ones the repository ships, a handwritten release
# intro comes along with them, and the runner needs no git-cliff.
#
# This workflow publishes nothing — crates.io is a `cargo publish` a person runs
# — so there is nothing here that cannot be undone: a release can be deleted and
# re-cut. The tag is the part that has already left, which is why `release` asks
# for `--push` explicitly.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to cut a release for
        required: true
permissions:
  contents: write # create the release
env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.ref }}
        # The notes are read from the tag's tree, but `gh release create` wants
        # the tag itself to exist as an object here too.
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable

    - name: Name the tag
      run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

    # The tag must name the version it is cut from — refuse a mismatch rather
    # than publish a surprise.
    - name: Check the tag against the manifest
      run: |
        version=$(cargo xtask version)
        echo "Manifest version: $version"
        if [ "${TAG#v}" != "$version" ]; then
          echo "::error::tag $TAG does not name version $version"
          exit 1
        fi

    # A tag whose changelog section is missing fails here, and the fix is to
    # write the section, re-tag, and re-run — not to hand-write notes that the
    # repository does not also carry.
    - run: cargo xtask release-notes "$TAG" > notes.md

    - run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
